name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test suite
        run: npm test

      - name: Verify end to end (fixture)
        run: node scripts/verify.js --structure tests/fixtures/target-structure

      - name: Routing eval gate (fixture)
        run: |
          cp -a tests/fixtures/target-structure "$RUNNER_TEMP/router-structure"
          node src/cli.js install --source tests/fixtures/source-ecc --structure "$RUNNER_TEMP/router-structure"
          node scripts/eval-routing.js \
            --structure "$RUNNER_TEMP/router-structure" \
            --cases scripts/routing-cases-fixture.json \
            --min-accuracy 1 \
            --min-off-domain 1

      - name: Shell syntax
        run: sh -n scripts/install.sh scripts/uninstall.sh

      - name: Install smoke test (donation skipped)
        run: |
          ANABOL_NO_DONATE=1 ./scripts/install.sh --target "$RUNNER_TEMP/anabol-skills"
          test -f "$RUNNER_TEMP/anabol-skills/anabol-orchestrator/SKILL.md"

      - name: Install never blocks on non-interactive stdin
        run: |
          ./scripts/install.sh --target "$RUNNER_TEMP/anabol-skills-2" < /dev/null
          test -f "$RUNNER_TEMP/anabol-skills-2/anabol-orchestrator/reference/ingest.md"
